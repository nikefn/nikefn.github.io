---
layout: page
title: Creative
---
<div class="projects">
    {% for post in site.posts %}
        {% if post.creative %}
            {% if post.hidden != true %}
                <div class="project">
                    <a href="{{ site.url }}{{ post.url }}">
                        <div class="thumbnail">
                            <img src="{{ post.img }}" alt="{{ post.title }}">
                        </div>
                        <h3 class="title">{{ post.title }}</h3>
                        <p class="summary">{{ post.summary }}</p>
                    </a>
                </div>
            {% endif %}
        {% endif %}
    {% endfor %}
</div>
