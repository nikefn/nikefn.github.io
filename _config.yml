title: "Niklas Effenberger"
description: "Urban sustainability strategist and EU project lead specialising in nature-based solutions, climate resilience, and nighttime urbanism. Research at Fraunhofer IAO."
url: https://nikefn.github.io
repository: nikefn/nikefn.github.io
baseurl: ""
picture: /assets/images/profile.jpg
permalink: /:title/

authors:
  niklaseffenberger:
    name: Niklas Effenberger
    picture: /assets/images/profile.jpg

# Top navigation, in order. The link to the current page is hidden.
nav:
  - { title: About, url: /about/ }
  - { title: Blog, url: /blog/ }
  - { title: Projects, url: /projects/ }
  - { title: Creative, url: /creative/ }
  - { title: Résumé, url: "https://drive.google.com/file/d/15cwwB3lIlc_YHwN6ck2ogp0NKBztWmtS" }

# Icons in the home header (Font Awesome 6 class names)
social:
  - { label: Unsplash, icon: fa-brands fa-unsplash, url: "https://unsplash.com/de/@neffler" }
  - { label: Instagram, icon: fa-brands fa-instagram, url: "https://instagram.com/jazzyjeffe71" }
  - { label: LinkedIn, icon: fa-brands fa-linkedin, url: "https://www.linkedin.com/in/niklaseffenberger" }
  - { label: GitHub, icon: fa-brands fa-github, url: "https://github.com/nikefn" }
  - { label: Email, icon: fa-regular fa-envelope, url: "mailto:niklas.effenberger@gmail.com" }

analytics-google: "G-1YZSDTC0X3"
google_site_verification: GI-Dcfouph0pv-6lYUaqBucLdMSoCiYujoyUonuCjsQ

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

defaults:
  - scope: { type: posts }
    values: { layout: post, author: niklaseffenberger }
  - scope: { path: assets }
    values: { sitemap: false }

compress_html:
  ignore:
    envs: [development]

exclude:
  - README.md
  - AGENTS.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - docker-compose.yml
  - vendor
