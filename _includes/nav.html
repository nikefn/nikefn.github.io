<nav class="{% if page.url == '/' %}nav-home{% else %}nav{% endif %}">
    <ul class="list">
        {% if page.url != '/' %}
            <li class="item"><a class="link" href="{{ site.url }}/">Home</a></li>
        {% endif %}
        {% for item in site.nav %}
            {% if item.url != page.url %}
                <li class="item"><a class="link" href="{% if item.url contains '://' %}{{ item.url }}{% else %}{{ site.url }}{{ item.url }}{% endif %}">{{ item.title }}</a></li>
            {% endif %}
        {% endfor %}
    </ul>
</nav>
