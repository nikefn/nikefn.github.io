{% assign author = site.authors[page.author] %}
<section class="author">
    <div class="toleft">
        <img class="selfie" src="{{ site.url }}{{ author.picture }}" alt="{{ author.name }}" />
    </div>
    <div class="toright">
        <h4 class="name">{{ author.name }}</h4>
    </div>
</section>
